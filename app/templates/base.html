<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}🌕 中秋小遊戲樂園 | Mid-Autumn Games Arcade{% endblock %}</title>

  <!-- Tailwind CSS Play CDN (Zero npm required) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            midautumn: {
              gold: '#f6d365',
              amber: '#fda085',
              navy: '#0d1322',
              sky: '#141d34',
              card: 'rgba(23, 32, 54, 0.85)',
              border: 'rgba(246, 211, 101, 0.25)',
              red: '#e63946'
            }
          },
          animation: {
            'moon-glow': 'moonGlow 6s ease-in-out infinite alternate',
            'bounce-click': 'bounceClick 0.15s ease-in-out',
            'float-up': 'floatUp 0.8s ease-out forwards',
          },
          keyframes: {
            moonGlow: {
              '0%': { transform: 'scale(1)', filter: 'drop-shadow(0 0 25px rgba(246, 211, 101, 0.4))' },
              '100%': { transform: 'scale(1.05)', filter: 'drop-shadow(0 0 45px rgba(246, 211, 101, 0.7))' }
            },
            bounceClick: {
              '0%': { transform: 'scale(1)' },
              '50%': { transform: 'scale(0.92)' },
              '100%': { transform: 'scale(1)' }
            },
            floatUp: {
              '0%': { opacity: '1', transform: 'translateY(0) scale(0.9)' },
              '100%': { opacity: '0', transform: 'translateY(-60px) scale(1.3)' }
            }
          }
        }
      }
    }
  </script>

  <!-- HTMX CDN: High-power dynamic HTML swapping with zero manual JS -->
  <script src="https://unpkg.com/htmx.org@1.9.11"></script>

  <!-- Lucide Icons CDN: Clean modern icons with zero npm and zero manual build step -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body 
  class="bg-gradient-to-b from-[#111827] via-[#0f172a] to-[#0a0f1d] min-h-screen text-slate-100 flex flex-col font-sans relative overflow-x-hidden antialiased"
  hx-on::after-swap="lucide.createIcons()"
>

  <!-- Ambient Glowing Moon & Starry Night Effect -->
  <div class="fixed top-8 right-12 w-28 h-28 md:w-36 md:h-36 rounded-full bg-gradient-to-br from-amber-100 via-amber-300 to-yellow-500 opacity-90 pointer-events-none z-0 animate-moon-glow"></div>
  <div class="fixed top-20 right-8 w-40 h-8 bg-white/10 rounded-full blur-md pointer-events-none z-0"></div>

  <!-- Main Body Content -->
  <div class="relative z-10 flex-1 flex flex-col">
    {% block content %}{% endblock %}
  </div>

  <!-- Global Footer -->
  <footer class="relative z-10 border-t border-slate-800/80 py-6 text-center text-xs text-slate-400">
    <p class="flex items-center justify-center gap-1.5">
      <i data-lucide="moon" class="w-4 h-4 text-amber-300 inline"></i>
      <span>2026 中秋佳節特別企劃・FastAPI + HTMX + TailwindCSS + Lucide Icons</span>
      <i data-lucide="sparkles" class="w-4 h-4 text-amber-300 inline"></i>
    </p>
    <p class="mt-1 text-slate-500">Zero npm • Zero Manual JS • Python Driven</p>
  </footer>

  <!-- Initialize Lucide Icons on first page load -->
  <script>lucide.createIcons();</script>
</body>
</html>
